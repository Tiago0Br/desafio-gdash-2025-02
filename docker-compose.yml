services:
  db:
    image: mongo
    container_name: weather_mongo
    restart: always
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
  broker:
    image: rabbitmq:3.13.7-management
    container_name: weather_broker
    restart: always
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
  api:
    build: ./api
    container_name: weather_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_REGION_NAME: ${VITE_REGION_NAME}
    container_name: weather_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - app-network

  collector:
    build: ./collector
    container_name: weather_collector
    restart: unless-stopped
    env_file: .env
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - app-network

  worker:
    build: ./worker
    container_name: weather_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      broker:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge